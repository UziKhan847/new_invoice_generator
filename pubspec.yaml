name: new_invoice_generator
description: "A new Flutter project."

publish_to: 'none' 

version: 3.0.3+19

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  supabase_flutter: ^2.12.0
  excel: ^4.0.6 
  pdf: ^3.11.3
  printing: ^5.12.0
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  share_plus: ^13.1.0
  open_filex: ^4.7.0
  custom_image_crop: ^0.1.1
  http: ^1.2.0
  flutter_email_sender: ^10.0.0
  permission_handler: ^12.0.1
  image_cropper: ^12.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.0.1
  file_picker: ^12.0.0-beta.5
  workmanager: ^0.9.0+3
  timezone: ^0.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

flutter:  
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/SplineSansMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SplineSansMono-Medium.ttf
          weight: 500



  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
